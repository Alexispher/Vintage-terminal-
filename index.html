<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>root@server:~</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #terminal-output {
            white-space: pre-wrap;
            line-height: 1.4;
            font-size: 15px;
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .prompt {
            margin-right: 8px;
            font-weight: bold;
        }

        input {
            background: transparent;
            border: none;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            flex-grow: 1;
            outline: none;
            caret-color: #00ff41;
        }

        /* Scanline sutil */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 2;
            background-size: 100% 2px;
            pointer-events: none;
        }
    </style>
</head>
<body onclick="document.getElementById('cmd').focus();">
    <div id="terminal-output">
        PEGASUS OS v4.19.0-x86_64
        Authentication successful.
        Type 'help' to see available commands.
    </div>
    
    <div class="input-line">
        <span class="prompt">root@system:~#</span>
        <input type="text" id="cmd" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <script>
        const input = document.getElementById('cmd');
        const output = document.getElementById('terminal-output');

        // Banco de dados de comandos
        const commands = {
            'help': `Available commands:
  whoami     - Display current user information
  ls         - List directory contents
  cat        - Concatenate and print files (e.g., 'cat projetos.txt')
  status     - Display system infrastructure metrics
  clear      - Clear the terminal screen`,
            
            'whoami': `User: Alexandre
Role: Computer Science Undergraduate / Systems Developer
Authentication: Verified
Certifications: AWS Academy Cloud Foundations`,

            'ls': `aws_cert.pem    pegasus_arch.md    projetos.txt    setup.sh`,

            'cat projetos.txt': `[PROJECT DIRECTORY]
1. PEGASUS
   - Type: Modular software framework
   - Scope: Cross-language plugins (iOS / Desktop)
   - Status: Active Development

2. OURWEDDING
   - Type: Web Interface / Interactive UI
   - Stack: HTML/CSS/JS (GitHub Pages)
   - Target Launch: 2028`,

            'cat pegasus_arch.md': `ERROR: Permission denied. File is encrypted.`,
            
            'cat aws_cert.pem': `-----BEGIN CERTIFICATE-----
MIIE... [KEY REDACTED FOR SECURITY] ...BQAw
-----END CERTIFICATE-----`,

            'status': `[INFRASTRUCTURE STATUS]
DNS Server : Pi-hole (10.0.1.112) [ACTIVE - 280 queries / 27 blocked]
Sys Metric : Heavy Duty constraints applied. 
Net Uplink : Stable`
        };

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmdVal = input.value.trim().toLowerCase();
                
                // Imprime a linha que o usuário digitou
                output.innerHTML += `\n\n<span class="prompt">root@system:~#</span> ${input.value}`;

                if (cmdVal === 'clear') {
                    output.innerHTML = '';
                } else if (cmdVal !== '') {
                    // Checa se o comando existe e imprime a resposta
                    if (commands[cmdVal]) {
                        output.innerHTML += `\n${commands[cmdVal]}`;
                    } else {
                        output.innerHTML += `\nbash: ${cmdVal}: command not found. Type 'help' for available commands.`;
                    }
                }

                // Limpa o input e desce a tela
                input.value = '';
                window.scrollTo(0, document.body.scrollHeight);
            }
        });
    </script>
</body>
</html>
