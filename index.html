<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEGASUS | DevSecOps Toolkit</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-main: #c9d1d9;
            --accent: #58a6ff;
            --border: #30363d;
            --success: #2ea043;
            --error: #f85149;
            --font-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #8b949e;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
        }

        .panel-header {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #010409;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            font-family: var(--font-mono);
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .output-box {
            margin-top: 10px;
            padding: 10px;
            background-color: #010409;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 40px;
        }

        .status-ok { color: var(--success); }
        .status-err { color: var(--error); }

        .btn-group {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 5px 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        /* Badge de segurança */
        .badge {
            font-size: 10px;
            padding: 2px 6px;
            background-color: rgba(46, 160, 67, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>PEGASUS // LOCAL DEV TOOLS</h1>
        <div class="subtitle">Client-side execution only. No server tracking. <span class="badge">SECURE</span></div>
    </header>

    <div class="grid">
        <div class="panel">
            <div class="panel-header">JSON Formatter & Validator</div>
            <textarea id="json-input" placeholder='Paste your JSON payload here...'></textarea>
            <div class="output-box" id="json-output">Ready...</div>
        </div>

        <div class="panel">
            <div class="panel-header">Base64 Encoder / Decoder</div>
            <textarea id="b64-input" placeholder="Enter text or Base64 string..."></textarea>
            <div class="btn-group">
                <button onclick="encodeBase64()">Encode</button>
                <button onclick="decodeBase64()">Decode</button>
            </div>
            <div class="output-box" id="b64-output">Result will appear here...</div>
        </div>

        <div class="panel">
            <div class="panel-header">SHA-256 Cryptographic Hash</div>
            <textarea id="hash-input" placeholder="Enter text to hash (generates in real-time)..."></textarea>
            <div class="output-box" id="hash-output" style="color: var(--accent);">Hash will appear here...</div>
        </div>
    </div>

    <script>
        // 1. JSON Validator Logic
        const jsonInput = document.getElementById('json-input');
        const jsonOutput = document.getElementById('json-output');

        jsonInput.addEventListener('input', function() {
            const val = jsonInput.value.trim();
            if (!val) {
                jsonOutput.innerHTML = "Ready...";
                jsonOutput.className = "output-box";
                return;
            }
            try {
                const parsed = JSON.parse(val);
                jsonOutput.innerHTML = JSON.stringify(parsed, null, 4);
                jsonOutput.className = "output-box status-ok";
            } catch (err) {
                jsonOutput.innerHTML = `<strong>Invalid JSON:</strong>\n${err.message}`;
                jsonOutput.className = "output-box status-err";
            }
        });

        // 2. Base64 Logic
        const b64Input = document.getElementById('b64-input');
        const b64Output = document.getElementById('b64-output');

        function encodeBase64() {
            try {
                b64Output.innerHTML = btoa(unescape(encodeURIComponent(b64Input.value)));
                b64Output.className = "output-box status-ok";
            } catch (err) {
                b64Output.innerHTML = "Encoding error.";
                b64Output.className = "output-box status-err";
            }
        }

        function decodeBase64() {
            try {
                b64Output.innerHTML = decodeURIComponent(escape(atob(b64Input.value.trim())));
                b64Output.className = "output-box status-ok";
            } catch (err) {
                b64Output.innerHTML = "Invalid Base64 string.";
                b64Output.className = "output-box status-err";
            }
        }

        // 3. SHA-256 Web Crypto API Logic
        const hashInput = document.getElementById('hash-input');
        const hashOutput = document.getElementById('hash-output');

        async function generateSHA256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        hashInput.addEventListener('input', async function() {
            const val = hashInput.value;
            if (!val) {
                hashOutput.innerHTML = "Hash will appear here...";
                return;
            }
            const hash = await generateSHA256(val);
            hashOutput.innerHTML = hash;
        });
    </script>
</body>
</html>
